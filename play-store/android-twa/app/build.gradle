plugins {
    id 'com.android.application'
}

def envFile = { name -> System.getenv(name) ?: '' }

android {
    namespace 'com.primehubmall.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.primehubmall.app"
        minSdk 24
        targetSdk 36
        versionCode 8
        versionName "8.0.0"
    }

    signingConfigs {
        release {
            def storePath = envFile('PRIMEHUB_STORE_FILE')
            if (storePath) {
                storeFile file(storePath)
                storePassword envFile('PRIMEHUB_STORE_PASSWORD')
                keyAlias envFile('PRIMEHUB_KEY_ALIAS')
                keyPassword envFile('PRIMEHUB_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (envFile('PRIMEHUB_STORE_FILE')) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

configurations.all {
    resolutionStrategy {
        force 'androidx.browser:browser:1.8.0'
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.6.2'
    implementation 'androidx.browser:browser:1.8.0'
}
