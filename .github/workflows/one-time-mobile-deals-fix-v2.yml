name: One-time mobile deals fix v2

on:
  push:
    branches:
      - feature/mobile-layout-and-deals

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/mobile-layout-and-deals
          fetch-depth: 0

      - name: Apply exact product-page fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/product/[id]/page.tsx')
          source = path.read_text(encoding='utf-8')

          state_old = "  const [added, setAdded] = useState(false);\n  const [nowTick, setNowTick] = useState<number | null>(null);"
          state_new = "  const [added, setAdded] = useState(false);\n  const [weeklyAddedId, setWeeklyAddedId] = useState<string | null>(null);\n  const [nowTick, setNowTick] = useState<number | null>(null);"
          if state_old in source:
              source = source.replace(state_old, state_new, 1)

          banner_start = '            {currentDeal && timing && nowTick !== null && ('
          banner_end = '\n\n            <div className="mt-5 flex flex-wrap items-center gap-2">'
          start = source.find(banner_start)
          end = source.find(banner_end, start)
          if start < 0 or end < 0:
              raise SystemExit('celebration banner block not found')
          banner_expr = source[start + len('            {'):end].strip()
          if banner_expr.endswith('}'):
              banner_expr = banner_expr[:-1]
          source = source[:start] + '            <div className="hidden md:block">{celebrationBanner}</div>' + source[end:]

          return_marker = '  return (\n    <main className="min-h-screen bg-[#F4F4F1] pb-28">'
          if '  const celebrationBanner = ' not in source:
              source = source.replace(return_marker, '  const celebrationBanner = ' + banner_expr + ';\n\n' + return_marker, 1)

          grid_marker = '        <div className="grid gap-5 px-3 md:grid-cols-[1.04fr_.96fr] md:px-5 md:pt-3">'
          mobile_banner = '        <div className="px-3 pt-3 md:hidden">{celebrationBanner}</div>\n\n'
          if mobile_banner not in source:
              source = source.replace(grid_marker, mobile_banner + grid_marker, 1)

          handler_marker = '  if (loading) {'
          if 'const addWeeklyDealToCart' not in source:
              handler = '''  const addWeeklyDealToCart = (deal: WeeklyDeal) => {\n    const item = weeklyProducts[deal.productId];\n    if (!item) return;\n    const normal = Number(item.price || deal.originalPrice || 0);\n    const dealP = Number(deal.dealPrice || 0);\n    const itemTiming = nowTick !== null ? dealTiming(deal.day, new Date(nowTick)) : null;\n    const itemLive = Boolean(itemTiming?.isLive);\n    const price = itemLive && dealP > 0 ? dealP : normal;\n    const itemStock = Number(item.stock ?? item.quantity ?? item.inventory ?? 10);\n    if (price <= 0 || itemStock <= 0) return;\n    const image = item.imageUrl || (item as any)?.image || deal.imageUrl || '';\n    addItem({ id: item.id, name: item.title || deal.title, price, originalPrice: itemLive ? Number((item as any).originalPrice || deal.originalPrice || price) : normal || price, image, imageUrl: image, dealDay: itemLive ? deal.day : undefined });\n    setWeeklyAddedId(deal.id);\n    window.setTimeout(() => setWeeklyAddedId((current) => current === deal.id ? null : current), 1200);\n  };\n\n'''
              source = source.replace(handler_marker, handler + handler_marker, 1)

          card_start = source.find('return <Link key={deal.id} href={`/product/${deal.productId}`')
          card_end_marker = '</Link>; })}</div></div></section>'
          card_end = source.find(card_end_marker, card_start)
          if card_start < 0 or card_end < 0:
              raise SystemExit(f'weekly calendar card block not found: start={card_start}, end={card_end}')
          card_end += len(card_end_marker)

          replacement = '''return <article key={deal.id} className="group w-[210px] shrink-0 snap-start overflow-hidden rounded-[22px] border border-black/8 bg-[#FCFCFA] transition hover:-translate-y-0.5 hover:shadow-md sm:w-[235px]">\n              <Link href={`/product/${deal.productId}`} className="block">\n                <div className="relative aspect-[4/3] overflow-hidden bg-[#F4F4F1]">{image ? <img src={image} alt={deal.title} className="h-full w-full object-cover transition duration-300 group-hover:scale-[1.03]" /> : <div className="flex h-full items-center justify-center text-[9px] font-bold text-black/25">No image</div>}<span className={`absolute left-2 top-2 rounded-full px-2 py-1 text-[7px] font-black uppercase ${itemLive ? 'bg-[#E1352B] text-white' : 'bg-white/95 text-black'}`}>{itemLive ? '⚡ LIVE TODAY' : `🔒 ${WEEKDAY_LABELS[deal.day]}`}</span></div>\n              </Link>\n              <div className="p-3"><p className="text-[8px] font-black uppercase tracking-[0.16em] text-[#0F6A5F]">{WEEKDAY_LABELS[deal.day]} Deal</p><h3 className="mt-1 line-clamp-2 min-h-[36px] text-sm font-black">{item?.title || deal.title}</h3><div className="mt-2 flex flex-wrap items-baseline gap-2"><span className="font-[family-name:var(--font-mono)] text-base font-black text-[#E1352B]">{money(dealP)}</span>{normal > dealP && <span className="text-[9px] font-bold text-black/35 line-through">{money(normal)}</span>}</div>{itemSave > 0 && <p className="mt-1 text-[8px] font-black text-[#0F6A5F]">SAVE {itemSave}% • {money(normal - dealP)} off</p>}<div className="mt-2 flex items-center gap-1 text-[8px] font-bold text-black/40">{itemLive ? <Clock3 size={10} /> : <LockKeyhole size={10} />}{itemLive ? `Ends in ${itemCountdown ? `${itemCountdown.hours.toString().padStart(2, '0')}:${itemCountdown.minutes.toString().padStart(2, '0')}:${itemCountdown.seconds.toString().padStart(2, '0')}` : '—'}` : `Unlocks ${WEEKDAY_LABELS[deal.day]}`}</div><button type="button" disabled={!item || Number(item.stock ?? item.quantity ?? item.inventory ?? 10) <= 0 || weeklyAddedId === deal.id} onClick={(event) => { event.preventDefault(); event.stopPropagation(); addWeeklyDealToCart(deal); }} className="mt-3 flex w-full items-center justify-center gap-1.5 rounded-xl bg-[#14140F] px-3 py-2.5 text-[8px] font-black uppercase text-white disabled:cursor-not-allowed disabled:opacity-40">{weeklyAddedId === deal.id ? '✓ ADDED TO CART' : '🛒 ADD TO CART'}</button></div>\n            </article>; })}</div></div></section>'''
          source = source[:card_start] + replacement + source[card_end:]

          path.write_text(source, encoding='utf-8')
          print('Product page changes applied.')

      - name: Run production build
        run: |
          npm ci
          npm run build

      - name: Commit changes and remove one-time workflows
        run: |
          rm -f .github/workflows/one-time-mobile-deals-fix.yml .github/workflows/one-time-mobile-deals-fix-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/product/'[id]'/page.tsx .github/workflows/one-time-mobile-deals-fix.yml .github/workflows/one-time-mobile-deals-fix-v2.yml
          git commit -m "fix: move live deal banner and add calendar cart"
          git push origin feature/mobile-layout-and-deals
