name: Salar customer colour flow patch

on:
  push:
    branches:
      - fix/salar-instruction-first
    paths:
      - scripts/salar-customer-flow-patch.mjs
      - .github/workflows/salar-customer-flow-patch.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/salar-instruction-first
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply Salar patch
        run: node scripts/salar-customer-flow-patch.mjs

      - name: Fix strict route typing
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = 'app/api/salar/chat/route.ts';
          let s = fs.readFileSync(file, 'utf8');
          const before = ') as SalarStoredProduct;';
          if (!s.includes(before)) throw new Error('SalarStoredProduct cast target not found');
          s = s.replace(before, ') as unknown as SalarStoredProduct;');
          fs.writeFileSync(file, s);
          NODE

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Commit tested changes to active branch
        run: |
          git config user.name "PrimeHub Salar Patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(salar): add custom colour ordering flow"
          git push origin HEAD:fix/salar-instruction-first
