name: PrimeHub Social AI QA
on:
  push:
    branches:
      - feat/primehub-social-ai-oct17
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate app JavaScript
        working-directory: social-ai
        run: npm run check
      - name: Run studio unit tests
        working-directory: social-ai
        run: npm test
