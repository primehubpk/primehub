name: PrimeHub Social AI QA
on:
  push:
    branches:
      - feat/primehub-social-ai-oct17
      - feat/primehub-social-mcp-bridge-oct17
      - feat/primehub-owner-device-pairing-oct17
      - feat/primehub-social-inapp-updates-oct18
      - feat/primehub-social-tiktok-owner-oauth-oct19
      - feat/primehub-social-live-web-accounts-oct19
      - feat/primehub-owner-assisted-native-tiktok-oct19
      - feat/primehub-general-android-ai-agent-oct19
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Validate app JavaScript
        working-directory: social-ai
        run: npm run check
      - name: Install browser-DOM test dependency
        working-directory: social-ai
        run: npm install --no-save --no-audit --no-fund jsdom@26
      - name: Run studio unit tests
        working-directory: social-ai
        run: npm test
      - name: Verify real owner pairing backend and revoke test record
        if: github.ref == 'refs/heads/feat/primehub-owner-device-pairing-oct17'
        working-directory: social-ai
        run: node tests/live-pairing.smoke.mjs
      - name: Verify deployed production MCP JSON-RPC
        if: github.ref == 'refs/heads/feat/primehub-social-mcp-bridge-oct17'
        working-directory: social-ai
        run: node tests/remote-mcp.smoke.mjs
