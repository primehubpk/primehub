name: Salar order memory patch

on:
  push:
    branches:
      - fix/salar-instruction-first
    paths:
      - .github/workflows/salar-order-memory-patch.yml

permissions:
  contents: read
  issues: write

jobs:
  patch-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/salar-instruction-first
          fetch-depth: 0

      - name: Apply model-driven order memory patch
        run: python scripts/salar-order-memory-patch.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture TypeScript diagnostics
        run: npx tsc --noEmit > /tmp/salar-order-tsc.txt 2>&1 || true

      - name: Publish temporary diagnostics issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -s /tmp/salar-order-tsc.txt ]; then
            {
              echo 'Temporary diagnostics for the Salar order-memory patch.'
              echo
              echo '```text'
              head -c 50000 /tmp/salar-order-tsc.txt
              echo
              echo '```'
            } > /tmp/issue-body.md
          else
            echo 'TypeScript check produced no diagnostics.' > /tmp/issue-body.md
          fi
          gh issue create --title "TEMP Salar order patch diagnostics" --body-file /tmp/issue-body.md
