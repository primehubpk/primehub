name: Cart and ISR isolated branch verification
on:
  push:
    branches: [fix/isr-cart-refresh-performance-oct17]
    paths:
      - '.github/workflows/one-time-cart-isr-ci-oct17.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/isr-cart-no-refresh.test.mjs tests/big-deal-admin-save.test.mjs tests/weekly-cart-price.test.mjs tests/product-overlay.test.mjs
      - run: npx tsc --noEmit
      - run: npm run build
