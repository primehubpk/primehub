name: Variant Hide V2

on:
  push:
    branches:
      - feat/bulk-editor-image-variant-controls

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/bulk-editor-image-variant-controls
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/variant_hide_patch.py
      - name: Commit patch
        run: |
          rm -f .github/workflows/variant-hide-v2.yml
          git config user.name "primehubpk"
          git config user.email "primehubpk1@gmail.com"
          git add -A
          git commit -m "feat(admin): hide and unhide individual variants"
          git push origin HEAD:feat/bulk-editor-image-variant-controls
