name: PrimeHub Nov17 Price and Referral Validation
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  scoped-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/primefamily-referrals.test.mjs tests/glass-offers-collection.test.mjs tests/bogo-offers.test.mjs
      - run: npx tsc --noEmit
