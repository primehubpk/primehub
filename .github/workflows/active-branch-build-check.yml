name: Active Branch Build Check

on:
  push:
    branches:
      - fix/supabase-orders-primary-20260918
    paths:
      - components/admin/OrdersManager.tsx
      - app/api/admin/orders/route.ts
      - .github/workflows/active-branch-build-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          CI: true
