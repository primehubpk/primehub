name: Salaar Virtual Salesman CI

on:
  push:
    branches:
      - feature/salaar-virtual-salesman
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Phase 2 intent smoke
        run: node scripts/salaar-phase2-intent-smoke.mjs

      - name: Build
        run: npm run build
