name: Prime Family Self Referral Branch QA (temporary)
on:
  push:
    branches:
      - fix/primefamily-self-referral-exclusive-nov03
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Test only referral and cashback regression flows
        run: node --test tests/primefamily-referrals.test.mjs tests/primefamily-cashback-promo.test.mjs
      - name: Type check all source
        run: npx tsc --noEmit
      - name: Next production build check (no deploy)
        run: npm run build
        env:
          CI: 'true'
