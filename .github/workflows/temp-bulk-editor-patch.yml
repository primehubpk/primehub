name: Temporary bulk editor patch

on:
  push:
    branches:
      - "feat/bulk-editor-image-variant-controls"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "feat/bulk-editor-image-variant-controls"
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/temp_bulk_editor_patch.py
      - name: Commit patch
        run: |
          git config user.name "primehubpk"
          git config user.email "primehubpk1@gmail.com"
          git add -A
          git commit -m "fix(admin): safe variant delete and size adder"
          git push origin HEAD:feat/bulk-editor-image-variant-controls
