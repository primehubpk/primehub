name: Salar remove hardcoded sales rules

on:
  push:
    branches:
      - fix/salar-instruction-first
    paths:
      - scripts/salar-remove-hardcoded-sales-rules.mjs
      - .github/workflows/salar-remove-hardcoded-sales-rules.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: fix/salar-instruction-first
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply no-hardcoded-sales patch
        run: node scripts/salar-remove-hardcoded-sales-rules.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Remove temporary patch files
        run: rm -f scripts/salar-remove-hardcoded-sales-rules.mjs .github/workflows/salar-remove-hardcoded-sales-rules.yml

      - name: Commit tested changes to active branch
        run: |
          git config user.name "PrimeHub Salar Patch"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "refactor(salar): let admin training control sales behaviour"
          git push origin HEAD:fix/salar-instruction-first
