<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#14140F" />
  <title>PrimeHubMall — Offline</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f4f4f1;color:#14140f}body{display:grid;place-items:center;min-height:100vh;padding:24px}.card{width:min(440px,100%);background:#fff;border:1px solid rgba(0,0,0,.07);border-radius:28px;padding:28px;box-shadow:0 18px 50px rgba(20,20,15,.08);text-align:center}.mark{width:64px;height:64px;margin:0 auto;border-radius:20px;background:#14140f;color:#ffcf68;display:grid;place-items:center;font-size:28px}.eyebrow{margin-top:18px;font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase;color:#0f6a5f}h1{margin:7px 0 0;font-size:26px;line-height:1.1}p{margin:12px auto 0;max-width:330px;font-size:13px;line-height:1.65;color:rgba(20,20,15,.55)}button{margin-top:20px;border:0;border-radius:14px;background:#14140f;color:#fff;font-weight:900;padding:13px 20px;cursor:pointer}.note{margin-top:12px;font-size:10px;color:rgba(20,20,15,.35)}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">PH</div>
    <div class="eyebrow">PrimeHubMall</div>
    <h1>You’re offline right now</h1>
    <p>Reconnect to load live products, stock, prices, deals, cart and order information. PrimeHubMall never shows cached live prices while you are offline.</p>
    <button type="button" onclick="location.reload()">Try Again</button>
    <div class="note">Static app assets may still be available for a faster return.</div>
  </main>
</body>
</html>
