<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#182a35">
<title>Send post to PrimeHub Social AI</title>
<style>body{margin:0;background:#f7faf8;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#213642}main{max-width:580px;margin:7vh auto;background:#fff;padding:30px;border:1px solid #e2ebe5;border-radius:20px;box-shadow:0 10px 44px #182d3314}h1{margin:.2em 0;font-size:29px;letter-spacing:-1px}.brand{font-size:12px;letter-spacing:2px;font-weight:800;color:#538042}.tag{background:#edf8e4;border-radius:7px;color:#538042;padding:5px 9px;font-size:11px;font-weight:800}.row{margin:22px 0;border-top:1px solid #e5ede8;padding-top:15px}.row span{display:block;font-size:12px;color:#74868d;margin-bottom:5px}.caption{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f8f5;padding:17px;border-radius:12px;max-height:280px;overflow:auto}.btn{display:block;text-align:center;background:#bff17b;color:#1d3b2e;border:0;border-radius:12px;padding:15px;font-weight:850;text-decoration:none;margin-top:12px;cursor:pointer}.secondary{background:#f3f7f5}.muted{font-size:12px;color:#768a90}.error{color:#b04c52}a{color:inherit}@media(max-width:630px){main{margin:13px;padding:22px}} </style>
</head><body><main><div class="brand">PRIMEHUB SOCIAL AI ✦</div><h1>Review your social task.</h1><p>Save an AI-prepared post to your Android app. Your approval is always required. Nothing publishes automatically.</p><span class="tag">OWNER APPROVAL REQUIRED</span>
<div id="preview" class="row"></div><a href="#" id="openApp" class="btn" hidden>✦ Open PrimeHub Social AI Android</a>
<p id="status" class="muted">Checking the task details…</p>
<a class="btn secondary" href="/">Open Web Studio ↗</a>
</main><script>
(()=>{
const platforms=new Set(['Facebook','Instagram','TikTok','YouTube','Google Business']);
const data=new URLSearchParams(location.search);
const title=(data.get('title')||'').trim();
const caption=(data.get('caption')||'').trim();
const platform=data.get('platform')||'';
const at=data.get('at')||'0';
const preview=document.getElementById('preview'),status=document.getElementById('status');
if(!title||title.length>100||!caption||caption.length>2400||!platforms.has(platform)||!/^[0-9]{1,15}$/.test(at)){
preview.textContent='Invalid or incomplete post details.';preview.classList.add('error');status.textContent='Ask ChatGPT to prepare a valid title, caption and platform.';return;
}
const time=Number(at);
if(!Number.isSafeInteger(time)||time<0||time>Date.now()+366*86400000){preview.textContent='Invalid reminder time.';return;}
for(const [label,value] of [['Title',title],['Platform',platform],['Caption',caption]]){
const wrap=document.createElement('div');wrap.style.marginBottom='15px';
const head=document.createElement('span');head.textContent=label;
const body=document.createElement('div');body.textContent=value;
if(label==='Caption')body.className='caption';
wrap.append(head,body);preview.append(wrap);
}
if(time>0){const t=document.createElement('p');t.textContent='Requested reminder: '+new Date(time).toLocaleString();preview.append(t);}
const out=new URLSearchParams({title,caption,platform,at});
const href='primehubsocial://import?'+out.toString();
if(href.length>4200){status.textContent='Task is too long for Android handoff. Shorten its caption and try again.';return;}
const open=document.getElementById('openApp');open.href=href;open.hidden=false;
status.textContent='Tap the green button. If Android asks which app to open, choose PrimeHub Social AI. The app will show a final confirmation.';
})();
</script></body></html>
